{% extends 'core/base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold mb-0">Anotações</h2>
    <a href="{% url 'anotacao_create' %}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Nova Anotação</a>
</div>

<div class="row g-4">
    {% for nota in anotacoes %}
    <div class="col-md-4">
        <div class="card h-100 p-4">
            <h5 class="fw-bold mb-2">{{ nota.titulo }}</h5>
            <small class="text-sec mb-3">{{ nota.data|date:"d/m/Y" }}</small>
            <p class="mb-0 text-muted" style="white-space: pre-line;">{{ nota.conteudo }}</p>
        </div>
    </div>
    {% empty %}
    <div class="col-12 text-center py-5">
        <p class="text-muted">Nenhuma anotação criada.</p>
    </div>
    {% endfor %}
</div>
{% endblock %}
