{% extends 'core/base.html' %}

{% block content %}
<div class="row align-items-center py-5">
    <div class="col-md-6 text-center text-md-start mb-4 mb-md-0">
        <h1 class="display-4 fw-bold text-primary-custom mb-3">Planeje seus treinos, conquiste suas metas!</h1>
        <p class="lead text-sec mb-4">FitRoutine é a sua agenda fitness digital. Organize sua semana, acompanhe sua frequência e não perca o foco.</p>
        <a href="{% url 'cadastro' %}" class="btn btn-accent btn-lg px-4 py-2 me-2">Começar Agora</a>
        <a href="{% url 'login' %}" class="btn btn-outline-primary btn-lg px-4 py-2">Já tenho conta</a>
    </div>
    <div class="col-md-6 text-center">
        <!-- Substituir por uma imagem real do dashboard gerada no design, mas como placeholder usando icone gigante -->
        <div class="card bg-primary text-white p-5 d-inline-block shadow-lg" style="border-radius: 24px; transform: rotate(3deg);">
            <i class="bi bi-calendar-check" style="font-size: 8rem;"></i>
            <h3 class="mt-3">Sua Rotina Organizada</h3>
        </div>
    </div>
</div>
{% endblock %}
