{% extends 'core/base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold mb-0"><i class="bi bi-person-arms-up text-primary-custom"></i> Grupos Musculares</h2>
    <a href="{% url 'grupo_create' %}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Novo Grupo</a>
</div>

<div class="row g-4">
    {% for grupo in grupos %}
    <div class="col-md-4">
        <div class="card p-4 h-100">
            <h5 class="fw-bold mb-2"><i class="bi bi-lightning-fill text-accent-custom"></i> {{ grupo.nome }}</h5>
            <p class="text-muted small mb-3">{{ grupo.descricao|default:"Sem descrição." }}</p>
            <div class="d-flex gap-2 mt-auto">
                <a href="{% url 'grupo_update' grupo.pk %}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-pencil"></i> Editar</a>
                <a href="{% url 'grupo_delete' grupo.pk %}" class="btn btn-outline-danger btn-sm"><i class="bi bi-trash"></i> Excluir</a>
            </div>
        </div>
    </div>
    {% empty %}
    <div class="col-12 text-center py-5">
        <p class="text-muted">Nenhum grupo muscular cadastrado ainda.</p>
    </div>
    {% endfor %}
</div>
{% endblock %}
