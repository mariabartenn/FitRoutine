{% extends 'core/base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold mb-0"><i class="bi bi-tags text-primary-custom"></i> Categorias de Exercício</h2>
    <a href="{% url 'categoria_create' %}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Nova Categoria</a>
</div>

<div class="row g-4">
    {% for categoria in categorias %}
    <div class="col-md-4">
        <div class="card p-4 h-100">
            <div class="d-flex justify-content-between align-items-start">
                <h5 class="fw-bold mb-2"><i class="bi bi-tag-fill text-accent-custom"></i> {{ categoria.nome }}</h5>
            </div>
            <p class="text-muted small mb-3">{{ categoria.descricao|default:"Sem descrição." }}</p>
            <div class="d-flex gap-2 mt-auto">
                <a href="{% url 'categoria_update' categoria.pk %}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-pencil"></i> Editar</a>
                <a href="{% url 'categoria_delete' categoria.pk %}" class="btn btn-outline-danger btn-sm"><i class="bi bi-trash"></i> Excluir</a>
            </div>
        </div>
    </div>
    {% empty %}
    <div class="col-12 text-center py-5">
        <p class="text-muted">Nenhuma categoria cadastrada ainda.</p>
    </div>
    {% endfor %}
</div>
{% endblock %}
