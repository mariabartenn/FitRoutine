{% extends 'core/base.html' %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 col-lg-5">
        <div class="card p-4">
            <h3 class="fw-bold text-center mb-4">Criar Conta</h3>
            <form method="post">
                {% csrf_token %}
                {% load crispy_forms_tags %}
                {{ form|crispy }}
                <button type="submit" class="btn btn-accent w-100 mb-3">Cadastrar</button>
            </form>
            <div class="text-center">
                <small class="text-muted">Já possui conta? <a href="{% url 'login' %}">Entrar</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
